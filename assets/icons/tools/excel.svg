<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  fill="none"
  role="img"
  aria-label="Excel logo"
>
  <defs>
    <!-- Main Excel greens -->
    <linearGradient id="excelMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21A366"/>
      <stop offset="100%" stop-color="#107C41"/>
    </linearGradient>

    <linearGradient id="excelBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33C481"/>
      <stop offset="100%" stop-color="#107C41"/>
    </linearGradient>

    <!-- Soft depth shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="8"
        dy="10"
        stdDeviation="10"
        flood-color="#063D25"
        flood-opacity="0.35"
      />
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="5"
        dy="7"
        stdDeviation="6"
        flood-color="#063D25"
        flood-opacity="0.28"
      />
    </filter>

    <!-- Subtle highlight -->
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ===================================================== -->
  <!-- BACK EXCEL DOCUMENT -->
  <!-- ===================================================== -->

  <g filter="url(#softShadow)">

    <!-- Main rear rounded sheet -->
    <rect
      x="126"
      y="32"
      width="354"
      height="448"
      rx="24"
      fill="url(#excelBack)"
    />

    <!-- Top-left panel -->
    <path
      d="M150 32
         H252
         V154
         H126
         V56
         C126 42.745 136.745 32 150 32Z"
      fill="#21A366"
    />

    <!-- Top-right panel -->
    <path
      d="M252 32
         H456
         C469.255 32 480 42.745 480 56
         V154
         H252Z"
      fill="#33C481"
    />

    <!-- Middle-left panel -->
    <rect
      x="126"
      y="154"
      width="126"
      height="100"
      fill="#107C41"
    />

    <!-- Middle-right panel -->
    <rect
      x="252"
      y="154"
      width="228"
      height="100"
      fill="#21A366"
    />

    <!-- Lower-left panel -->
    <rect
      x="126"
      y="254"
      width="126"
      height="100"
      fill="#0B6E3C"
    />

    <!-- Lower-right panel -->
    <rect
      x="252"
      y="254"
      width="228"
      height="100"
      fill="#107C41"
    />

    <!-- Bottom panel -->
    <path
      d="M126 354
         H480
         V456
         C480 469.255 469.255 480 456 480
         H150
         C136.745 480 126 469.255 126 456Z"
      fill="#185C37"
    />

    <!-- Subtle top highlight -->
    <path
      d="M150 32H456C469.255 32 480 42.745 480 56V154H126V56C126 42.745 136.745 32 150 32Z"
      fill="url(#highlight)"
    />
  </g>

  <!-- ===================================================== -->
  <!-- FRONT EXCEL X PANEL -->
  <!-- ===================================================== -->

  <!-- Rear depth layers -->
  <g opacity="0.8">
    <rect
      x="12"
      y="122"
      width="284"
      height="282"
      rx="20"
      fill="#075C32"
      opacity="0.45"
    />

    <rect
      x="7"
      y="116"
      width="284"
      height="282"
      rx="20"
      fill="#0A6B3A"
      opacity="0.65"
    />
  </g>

  <!-- Main front tile -->
  <g filter="url(#shadow)">
    <rect
      x="4"
      y="108"
      width="284"
      height="282"
      rx="20"
      fill="url(#excelMain)"
    />

    <!-- Subtle front highlight -->
    <rect
      x="4"
      y="108"
      width="284"
      height="282"
      rx="20"
      fill="url(#highlight)"
    />
  </g>

  <!-- ===================================================== -->
  <!-- WHITE EXCEL X -->
  <!-- ===================================================== -->

  <path
    d="
      M70 166
      H112
      L145 224
      L178 166
      H220
      L166 248
      L222 332
      H180
      L145 270
      L110 332
      H68
      L124 248
      Z
    "
    fill="#FFFFFF"
  />

</svg>